[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dqdetect"
version = "1.0.0"
description = "Command-line data quality profiler for files and database tables"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Shahed"}
]
keywords = [
  "data-quality",
  "data-profiling",
  "csv",
  "excel",
  "postgresql",
  "analytics",
  "pandas",
  "cli"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
  "pandas>=2.2",
  "openpyxl>=3.1"
]

[project.optional-dependencies]
database = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1"
]
web = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9"
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "sqlalchemy>=2.0",
  "twine>=6.0",
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "httpx>=0.27"
]

[project.scripts]
dqdetect = "dqdetect.cli:main"

[project.urls]
Homepage = "https://github.com/Shahedr/data-quality-detective"
Repository = "https://github.com/Shahedr/data-quality-detective"
Issues = "https://github.com/Shahedr/data-quality-detective/issues"
Changelog = "https://github.com/Shahedr/data-quality-detective/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["dqdetect*", "webapp*"]

[tool.setuptools.package-data]
webapp = ["static/*.html", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
