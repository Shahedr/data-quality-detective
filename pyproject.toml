[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dqdetect"
version = "0.1.0"
description = "Command-line data quality profiler for CSV and Excel files"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Shahed"}
]
keywords = [
  "data-quality",
  "data-profiling",
  "csv",
  "excel",
  "analytics",
  "pandas"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
  "pandas>=2.2",
  "openpyxl>=3.1"
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "twine>=6.0"
]

[project.scripts]
dqdetect = "dqdetect.cli:main"

[project.urls]
Homepage = "https://github.com/Shahedr/data-quality-detective"
Repository = "https://github.com/Shahedr/data-quality-detective"
Issues = "https://github.com/Shahedr/data-quality-detective/issues"

[tool.setuptools.packages.find]
include = ["dqdetect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
