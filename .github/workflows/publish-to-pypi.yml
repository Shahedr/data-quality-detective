name: Publish package to PyPI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to release"
        required: true
        default: "main"

jobs:
  build:
    name: Verify and build release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish_needed: ${{ steps.pypi.outputs.publish_needed }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Read and verify version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          INIT_VERSION=$(python -c "from dqdetect import __version__; print(__version__)")
          if [ "$VERSION" != "$INIT_VERSION" ]; then
            echo "pyproject.toml version $VERSION does not match dqdetect.__version__ $INIT_VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release commit title
        if: github.event_name == 'push'
        shell: bash
        run: |
          EXPECTED="Release v${{ steps.version.outputs.version }}"
          ACTUAL="${{ github.event.head_commit.message }}"
          case "$ACTUAL" in
            "$EXPECTED"*) ;;
            *)
              echo "Release commit must start with: $EXPECTED"
              exit 1
              ;;
          esac

      - name: Install release dependencies
        run: python -m pip install --upgrade build twine pytest sqlalchemy

      - name: Run unit and integration-safe tests
        run: python -m pip install -e ".[dev,database]" && pytest -q

      - name: Build package
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Check whether version already exists on PyPI
        id: pypi
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if python -c "import urllib.request; urllib.request.urlopen('https://pypi.org/pypi/dqdetect/' + '$VERSION' + '/json')" 2>/dev/null; then
            echo "publish_needed=false" >> "$GITHUB_OUTPUT"
            echo "dqdetect $VERSION already exists on PyPI; publish step will be skipped."
          else
            echo "publish_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: needs.build.outputs.publish_needed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dqdetect/
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Create GitHub release
    needs: [build, publish]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a GitHub release."
            exit 0
          fi

          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "Data Quality Detective $TAG" \
            --notes-file RELEASE_NOTES.md
