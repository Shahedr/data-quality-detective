name: Portable desktop downloads
on:
  push:
    branches: [main]
    paths: [desktop_launcher.py, build_desktop.py, .github/workflows/desktop-build.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime and builder
        run: python -m pip install ".[web]" pyinstaller==6.22.3
      - name: Build and launch-test the packaged app
        run: python build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: desktop-dist/*
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop-dist
          merge-multiple: true
      - name: Publish tested community preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: desktop-preview-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" desktop-dist/* --target "$GITHUB_SHA" --prerelease --title "Local app community preview ${{ github.run_number }}" --notes-file DESKTOP_DOWNLOADS.md
