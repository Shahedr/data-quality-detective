name: Owner dashboard isolated live preview smoke

on:
  push:
    branches: [feature/owner-mfa-readonly-rpc-dashboard]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check owner dashboard preview without customer activation
        env:
          ORIGIN: https://data-quality-detective-demo-pmtpu28uv-shahedr2744-1751.vercel.app
        run: |
          python3 - <<'PY'
          import json,os,time
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          origin=os.environ["ORIGIN"].rstrip("/")
          def call(url,method="GET",body=None,headers=None):
              req=Request(url,data=body,method=method,
                headers={"User-Agent":"DQD-owner-RPC-gating-smoke",**(headers or {})})
              try:
                  with urlopen(req,timeout=25) as r:
                      return r.status,r.headers.get("content-type",""),r.read(2*1024*1024)
              except HTTPError as e:
                  return e.code,e.headers.get("content-type",""),e.read(2*1024*1024)
          def getjson(path):
              code,typ,body=call(origin+path)
              if code!=200 or "application/json" not in typ:
                  raise ValueError("Unexpected API response "+path+" HTTP "+str(code))
              return json.loads(body)
          for i in range(22):
              try:
                  cfg=getjson("/api/saas/admin/config")
                  if cfg.get("overview_enabled") is True:
                      break
              except ValueError:
                  pass
              print("Waiting for ready owner dashboard preview",i+1,flush=True)
              time.sleep(6)
          else:
              raise SystemExit("Owner-only preview never became ready")
          assert cfg["enabled"] is True and cfg["overview_source"]=="supabase_rpc"
          assert cfg["mfa_required"] is True
          assert cfg["supabase_url"].startswith("https://")
          assert cfg["supabase_anon_key"].startswith("sb_publishable_")
          assert "DQD_ADMIN_USER_ID" not in str(cfg)
          assert getjson("/api/config")["upload_allowed"] is False
          assert getjson("/api/saas/config")["enabled"] is False
          assert getjson("/api/demo/analyze")["summary"]["rows"]==12
          code,typ,body=call(origin+"/admin")
          assert code==200 and b'id="dailyActivity"' in body and b'id="monthlyActivity"' in body
          code,typ,body=call(origin+"/admin.js")
          assert code==200 and b'client.rpc("dqd_owner_overview")' in body
          for path,expected in (
              ("/api/analyze",403),
              ("/api/saas/analyze",503),
              ("/api/saas/billing/checkout",503),
          ):
              code,typ,body=call(origin+path,method="POST",body=b"")
              assert code==expected,(path,code,body[:150])
          code,typ,body=call(origin+"/api/saas/admin/overview")
          assert code==503,"Server DB admin endpoint unexpectedly opened"
          rpc=cfg["supabase_url"].rstrip("/")+"/rest/v1/rpc/dqd_owner_overview"
          api_key=cfg["supabase_anon_key"]
          code,typ,body=call(rpc,method="POST",body=b"{}",
              headers={"apikey":api_key,"Content-Type":"application/json"})
          assert code in (401,403,404),(code,body[:220])
          assert b'"accounts"' not in body
          print("OWNER DASHBOARD PREVIEW PASS: MFA-only RPC, unauth denied, SaaS disabled",flush=True)
          PY
