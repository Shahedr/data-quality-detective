name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dqdetect
          POSTGRES_PASSWORD: dqdetect
          POSTGRES_DB: dqdetect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dqdetect -d dqdetect"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DQDETECT_TEST_POSTGRES_URL: postgresql+psycopg://dqdetect:dqdetect@localhost:5432/dqdetect
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev,database]"

      - name: Run tests
        run: pytest -q

      - name: Smoke-test CLI
        run: |
          dqdetect examples/messy_orders.csv --format md --output /tmp/dqdetect-reports
          test -f /tmp/dqdetect-reports/messy_orders_report.md

  macos-local-smoke:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Follow documented Mac installation
        run: |
          python3 -m venv .venv
          ./.venv/bin/python -m pip install -e ".[web]"
          ./.venv/bin/python -m pip install pytest httpx
      - name: Test CLI, local launcher, workbook safety and large-file flows
        run: >-
          ./.venv/bin/python -m pytest -q
          tests/test_cli.py tests/test_local_launcher.py tests/test_workspace.py
          tests/test_largefiles.py tests/test_large_cleaning.py
          tests/test_large_workbook_security.py tests/test_asvs_security.py
      - name: Check local launcher entrypoint
        run: ./.venv/bin/python -m webapp.launch_local --help
      - name: Start the real loopback server on macOS
        run: |
          ./.venv/bin/python - <<'PY'
          import json, subprocess, sys, time
          from urllib.request import urlopen
          server = subprocess.Popen([sys.executable, '-m', 'webapp.launch_local', '--port', '18765', '--no-browser'])
          try:
              for attempt in range(100):
                  try:
                      with urlopen('http://127.0.0.1:18765/api/config', timeout=2) as response:
                          config = json.loads(response.read())
                      break
                  except OSError:
                      if server.poll() is not None:
                          raise RuntimeError('Local server exited during startup')
                      time.sleep(0.1)
              else:
                  raise RuntimeError('Local server did not start')
              assert config['mode'] == 'local' and config['large_upload_bytes'] == 1024**3, config
              print('macOS real HTTP startup and 1 GiB local configuration passed')
          finally:
              server.terminate()
              server.wait(timeout=15)
          PY

  windows-native-smoke:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Windows native optional dependency
        run: python -m pip install -e ".[dev,excel-native]"

      - name: Verify Windows Excel adapter with mocked COM
        run: python -m pytest -q tests/test_excel_native.py

      - name: Verify Excel-native CLI entrypoint
        run: python -m webapp.excel_native --help

      - name: Verify desktop launcher CLI without opening a GUI
        run: python -m webapp.excel_desktop --help

  postgres-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dqdetect
          POSTGRES_PASSWORD: dqdetect
          POSTGRES_DB: dqdetect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dqdetect -d dqdetect"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package with database support
        run: pip install -e ".[dev,database]"

      - name: Run PostgreSQL integration test
        env:
          DQDETECT_TEST_POSTGRES_URL: postgresql+psycopg://dqdetect:dqdetect@localhost:5432/dqdetect
        run: pytest -q tests/test_postgres.py

  action-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run local Data Quality Detective action
        uses: ./
        with:
          file: examples/messy_orders.csv
          format: json
          output: /tmp/dqdetect-action-reports

      - name: Verify action output
        run: test -f /tmp/dqdetect-action-reports/messy_orders_report.json

  build:
    runs-on: ubuntu-latest
    needs: [test, macos-local-smoke, windows-native-smoke, postgres-integration, action-smoke]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build distribution
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*
