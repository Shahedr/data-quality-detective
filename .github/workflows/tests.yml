name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Smoke-test CLI
        run: |
          dqdetect examples/messy_orders.csv --format md --output /tmp/dqdetect-reports
          test -f /tmp/dqdetect-reports/messy_orders_report.md
