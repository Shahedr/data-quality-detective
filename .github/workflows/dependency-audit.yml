name: Dependency security and license inventory

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install runtime and developer dependencies
        run: python -m pip install -e '.[dev,saas]' 'pip-licenses>=5,<7' 'pip-audit>=2.7,<4'
      - name: Produce legal license inventory
        run: pip-licenses --format=json --output-file=third_party_licenses.json
      - name: Check known published security advisories
        run: pip-audit --format=json --output dependency_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-license-and-security-${{ github.run_id }}
          path: |
            third_party_licenses.json
            dependency_audit.json
          retention-days: 30
