name: Hosted SaaS safety-gate smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hosted-saas-safety-smoke.yml'

permissions:
  contents: read

jobs:
  check-hosted-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify hosted SaaS stays closed until approved
        run: |
          python3 - <<'PY'
          import json, time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          origin='https://data-quality-detective-demo.vercel.app'
          def get(path, method='GET', data=None, headers=None):
              req=Request(origin+path,data=data,method=method,headers=headers or {})
              try:
                  with urlopen(req,timeout=30) as res:
                      return res.status,res.read()
              except HTTPError as e:
                  return e.code,e.read()
          for n in range(15):
              status,body=get('/api/saas/config')
              if status==200:
                  print('Private beta endpoint ready',flush=True)
                  break
              print(f'Waiting for deployment: {status}',flush=True)
              time.sleep(8)
          else:
              raise RuntimeError('New SaaS endpoint did not become public')
          config=json.loads(body)
          assert config['enabled'] is False,config
          print('Private-beta commercial endpoints disabled: OK')
          for route,fragment in [('/app',b'Private workspace'),('/privacy',b'Privacy'),('/terms',b'Terms')]:
              status,body=get(route)
              assert status==200 and fragment.lower() in body.lower(),(route,status,body[:150])
              print('Route available: '+route)
          for route in ('/api/saas/account','/api/saas/billing/checkout'):
              method='GET' if route.endswith('/account') else 'POST'
              status,body=get(route,method=method,data=b'' if method=='POST' else None)
              assert status==503,(route,status,body[:150])
              print('Sensitive endpoint disabled: '+route)
          status,body=get('/api/saas/analyze',method='POST',data=b'')
          assert status==503,(status,body[:150])
          status,body=get('/api/config')
          assert status==200 and json.loads(body)['upload_allowed'] is False
          status,body=get('/api/demo/analyze')
          assert status==200 and json.loads(body)['summary']['rows']==12
          status,body=get('/api/analyze',method='POST',data=b'')
          assert status==403,(status,body[:150])
          print('ALL LIVE SAAS SAFETY GATES PASSED')
          PY
