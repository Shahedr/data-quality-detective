name: Production public-demo safety smoke
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact live FastAPI JSON and all customer activation gates
        env:
          ORIGIN: https://data-quality-detective-demo.vercel.app
        run: |
          python3 - <<'PY'
          import json,os,time
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          origin=os.environ['ORIGIN'].rstrip('/')
          def call(path,method='GET',payload=None):
              req=Request(origin+path,data=payload,method=method,
                          headers={'User-Agent':'DQD-verified-production-safety'})
              try:
                  with urlopen(req,timeout=25) as res:
                      return res.status,res.headers.get('content-type',''),res.read(2*1024*1024)
              except HTTPError as e:
                  return e.code,e.headers.get('content-type',''),e.read(2*1024*1024)
          def jget(path):
              status,content_type,body=call(path)
              if status!=200 or 'application/json' not in content_type:
                  raise RuntimeError(f'Wrong API response {path}: HTTP {status} / {content_type}')
              return json.loads(body)
          for attempt in range(16):
              try:
                  cfg=jget('/api/config')
                  if cfg.get('mode')=='public_demo' and cfg.get('upload_allowed') is False:
                      break
              except RuntimeError:
                  pass
              time.sleep(5)
          else:
              raise SystemExit('Production demo not ready with expected JSON; fail closed')
          assert jget('/api/saas/config')['enabled'] is False
          # Administrative actions now belong in Supabase Dashboard, not this site.
          for route in ('/api/saas/admin/config','/api/saas/admin/overview','/admin','/admin.js'):
              status,content_type,body=call(route)
              assert status==404,(route,status,body[:100])
          assert jget('/api/demo/analyze')['summary']['rows']==12
          for route,expected in (
            ('/api/analyze',403),
            ('/api/saas/analyze',503),
            ('/api/saas/billing/checkout',503),
          ):
              status,typ,body=call(route,'POST',b'')
              assert status==expected,(route,status,body[:100])
          print('PRODUCTION SAFETY PASS: sample demo, no admin webapp, no customer uploads/payments',flush=True)
          PY
