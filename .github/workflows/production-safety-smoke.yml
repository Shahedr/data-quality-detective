name: Free webapp production smoke
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  free-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify public free CSV analysis, exports, and no billing
        env:
          ORIGIN: https://data-quality-detective-demo.vercel.app
        run: |
          python3 - <<'PY'
          import json,os,time
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          base=os.environ["ORIGIN"].rstrip("/")
          def call(path,method="GET",payload=None,headers=None):
              r=Request(base+path,data=payload,method=method,
                        headers={"User-Agent":"DQD-free-live-smoke",**(headers or {})})
              try:
                  with urlopen(r,timeout=30) as x:
                      return x.status,x.headers.get("content-type",""),x.read(3*1024*1024)
              except HTTPError as e:
                  return e.code,e.headers.get("content-type",""),e.read(3*1024*1024)
          def multipart(filename,body):
              boundary="DQDfreeSmokeBoundary"
              data=(f"--{boundary}\r\n"
                    f'Content-Disposition: form-data; name="file"; filename="{filename}"\r\n'
                    "Content-Type: application/octet-stream\r\n\r\n").encode()+body+(
                    f"\r\n--{boundary}--\r\n").encode()
              return data,{"Content-Type":"multipart/form-data; boundary="+boundary}
          expected_sha=os.environ.get("GITHUB_SHA", "")
          for _ in range(48):
              code,typ,body=call("/api/config")
              if code==200 and "application/json" in typ:
                  cfg=json.loads(body)
                  if (cfg.get("mode")=="free_web" and cfg.get("upload_allowed") is True
                      and (not expected_sha or cfg.get("release_sha")==expected_sha)):
                      break
              time.sleep(5)
          else:raise SystemExit("Expected release is not serving on the public alias: "+expected_sha)
          assert cfg["max_upload_bytes"]==4*1024*1024
          code,typ,page=call("/")
          assert code==200 and b"Choose file" in page and b"Free" in page
          body,headers=multipart("demo.csv",b"id,value\n1,10\n2,20\n2,20\n")
          code,typ,raw=call("/api/analyze","POST",body,headers)
          assert code==200,(code,raw[:300])
          result=json.loads(raw)
          assert result["summary"]["rows"]==3 and result["summary"]["duplicate_rows"]==1,result["summary"]
          code,typ,raw=call("/api/rows","POST",body,headers)
          assert code==200 and json.loads(raw)["total_rows"]==3
          code,typ,raw=call("/api/export/html","POST",body,headers)
          assert code==200 and b"<html" in raw.lower()
          code,typ,raw=call("/api/export/xlsx","POST",body,headers)
          assert code==200 and raw.startswith(b"PK")
          bad,head=multipart("not-data.json",b"{}")
          code,typ,raw=call("/api/analyze","POST",bad,head)
          assert code==415,(code,raw[:200])
          code,typ,raw=call("/api/analyze","POST",b"x"*(5*1024*1024))
          assert code==413,(code,raw[:200])
          for path in ("/app","/product","/api/saas/config",
                       "/api/saas/analyze","/api/saas/billing/checkout"):
              code,typ,raw=call(path)
              assert code==404,(path,code)
          for path in ("/privacy","/terms","/cookies"):
              code,typ,raw=call(path)
              assert code==200 and b"shahed2338@gmail.com" in raw,(path,code)
          for path in ("/openapi.json",):
              code,typ,raw=call(path)
              assert code==404,(path,code)
          code,typ,raw=call("/api/large/uploads","POST",b'{"name":"test.csv","size":100}',{"Content-Type":"application/json"})
          assert code==404,(code,raw[:200])
          print("FREE WEBAPP PASS: CSV analysis, paged grid, HTML/XLSX exports; paid routes removed",flush=True)
          PY
