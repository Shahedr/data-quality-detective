<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="96" y="100" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff">
    Data Quality Detective
  </text>
  <text x="96" y="148" font-family="Inter, Arial, sans-serif" font-size="24" fill="#a7b0c2">
    A lightweight first-pass profiler for CSV and Excel files
  </text>

  <!-- Arrow labels -->
  <text x="340" y="232" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#7dd3fc">1. INPUT</text>
  <text x="746" y="232" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#7dd3fc">2. RUN</text>
  <text x="1094" y="232" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#7dd3fc">3. REVIEW</text>

  <!-- Input card -->
  <rect x="90" y="260" rx="22" ry="22" width="430" height="470" fill="#ffffff" filter="url(#shadow)"/>
  <text x="122" y="310" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">messy_orders.csv</text>
  <line x1="122" y1="330" x2="486" y2="330" stroke="#e5e7eb"/>
  <text x="122" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#475569">order_date</text>
  <text x="288" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#475569">freight_cost</text>
  <text x="122" y="410" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#111827">2025-01-03</text>
  <text x="288" y="410" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#111827">12.50</text>
  <text x="122" y="450" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#b91c1c">not-a-date</text>
  <text x="288" y="450" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#b45309">Included</text>
  <text x="122" y="490" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#111827">2025-01-08</text>
  <text x="288" y="490" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#111827">45.00</text>
  <text x="122" y="530" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#111827">2025-01-09</text>
  <text x="288" y="530" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#b91c1c">missing</text>
  <text x="122" y="570" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#111827">2025-01-13</text>
  <text x="288" y="570" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#b91c1c">1500.00</text>

  <rect x="122" y="626" rx="10" ry="10" width="326" height="58" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="144" y="661" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">messy data enters unchanged</text>

  <!-- Arrow 1 -->
  <line x1="545" y1="495" x2="650" y2="495" stroke="#38bdf8" stroke-width="5"/>
  <polygon points="650,495 630,483 630,507" fill="#38bdf8"/>

  <!-- Terminal card -->
  <rect x="675" y="345" rx="20" ry="20" width="360" height="300" fill="#020617" stroke="#273449" filter="url(#shadow)"/>
  <circle cx="710" cy="378" r="8" fill="#ef4444"/>
  <circle cx="736" cy="378" r="8" fill="#f59e0b"/>
  <circle cx="762" cy="378" r="8" fill="#22c55e"/>

  <text x="710" y="445" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#e2e8f0">$ dqdetect messy_orders.csv</text>
  <text x="710" y="500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#94a3b8">Rows: 12</text>
  <text x="710" y="535" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#94a3b8">Columns: 8</text>
  <text x="710" y="570" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#94a3b8">Duplicate rows: 1</text>
  <text x="710" y="615" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#7dd3fc">→ report generated</text>

  <!-- Arrow 2 -->
  <line x1="1060" y1="495" x2="1155" y2="495" stroke="#38bdf8" stroke-width="5"/>
  <polygon points="1155,495 1135,483 1135,507" fill="#38bdf8"/>

  <!-- Report card -->
  <rect x="1180" y="260" rx="22" ry="22" width="330" height="470" fill="#ffffff" filter="url(#shadow)"/>
  <text x="1212" y="310" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Issues found</text>

  <rect x="1212" y="350" rx="12" ry="12" width="266" height="62" fill="#eff6ff"/>
  <text x="1234" y="389" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">2 columns with missing values</text>

  <rect x="1212" y="430" rx="12" ry="12" width="266" height="62" fill="#fff7ed"/>
  <text x="1234" y="469" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#c2410c">1 mixed numeric/text column</text>

  <rect x="1212" y="510" rx="12" ry="12" width="266" height="62" fill="#fef2f2"/>
  <text x="1234" y="549" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#b91c1c">1 invalid date column</text>

  <rect x="1212" y="590" rx="12" ry="12" width="266" height="62" fill="#f5f3ff"/>
  <text x="1234" y="629" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#6d28d9">2 numeric columns with outliers</text>

  <text x="1212" y="695" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">Markdown · HTML</text>

  <text x="96" y="820" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#ffffff">
    Flag what deserves attention. Leave the cleaning decision to the analyst.
  </text>
  <text x="96" y="860" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94a3b8">
    github.com/Shahedr/data-quality-detective
  </text>
</svg>